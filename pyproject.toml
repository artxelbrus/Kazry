[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kazry"
version = "0.1.0"
authors = [
  { name="artxelbrus" },
]
description = "Kazry - a high-performance piecewise-defined activation function written in OpenAI Triton"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "triton>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com"